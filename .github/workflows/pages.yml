name: Deploy & update prices

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *' # каждый час
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update prices
        if: github.event_name != 'push'
        env:
          PRICE_SOURCE_URL: ${{ vars.PRICE_SOURCE_URL }}
        run: |
          node scripts/update-prices.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Update prices" || echo "no changes"
          git push

      - name: Build site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
