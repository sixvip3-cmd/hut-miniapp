# Cloudflare Worker: HUT Builder доступен только из Telegram и только с оплаченным доступом (рубли через RollyPay).
name = "hut-builder"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

# Приложение и данные (собираются в _site скриптом scripts/build-site.js).
# run_worker_first: каждый запрос сначала проходит проверку доступа в воркере.
[assets]
directory = "./_site"
binding = "ASSETS"
run_worker_first = true

# Напоминания и дайджест (каждые 30 мин), рассылка /broadcast (каждую минуту).
[triggers]
crons = ["*/30 * * * *", "* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hut-builder"
database_id = "00000000-0000-0000-0000-000000000000" # подставляется при деплое

[vars]
TRIAL_DAYS = "3"              # пробный период (0 — выключить)
REF_BONUS_DAYS = "7"          # бонус пригласившему, когда друг оформил подписку
ROLLYPAY_ENABLED = "1"        # "0" — спрятать оплату везде (выключатель)
ROLLYPAY_TEST = "0"           # "1" — тестовые платежи RollyPay (без реальных денег)
ADMIN_IDS = ""                # Telegram id через запятую: бесплатный доступ и команда /refund
SUPPORT_CONTACT = ""          # контакт для /paysupport, например @username
BOT_USERNAME = ""             # username бота без @ — для кнопки «Открыть в Telegram»

# Секреты BOT_TOKEN, ROLLYPAY_API_KEY, ROLLYPAY_SIGNING_SECRET задаются через `wrangler secret put` (в CI — из секретов GitHub).
